name: lolango_v2
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI / UX
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  smooth_page_indicator: ^1.2.0
  lucide_icons_flutter: ^3.1.15

  # Navigation déclarative (obligatoire pour deep-linking, guards d'auth, nested navigation)
  go_router: ^15.1.2

  # Modèles immuables + génération de code (évite les bugs de copyWith/equality à la main)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Formatage dates/heures (question du jour, horodatage messages)
  intl: ^0.19.0

  # Backend
  supabase_flutter: ^2.8.4

  # Google Sign-In
  google_sign_in: ^7.2.0
  geolocator: ^10.0.0
  http: ^1.1.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  google_fonts: ^8.2.1
  flutter_native_splash: ^2.4.8
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_card_swiper: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_app.png"

flutter_native_splash:
  color: "#FFE44D"
  color_dark: "#0D0D0D"
  image: "assets/images/native_splash_light.png"
  image_dark: "assets/images/native_splash_dark.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/native_splash_light.png"
    image_dark: "assets/images/native_splash_dark.png"
    color: "#FFE44D"
    color_dark: "#0D0D0D"
